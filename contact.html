<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nusantara Meal Prep - Kontak</title>
  <meta name="description" content="Hubungi Nusantara Meal Prep untuk langganan, katering kantor, dan konsultasi gizi.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=JetBrains+Mono:wght@400..700&family=Plus+Jakarta+Sans:wght@400..700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/pages/contact.css">
</head>
<body data-page="contact">
  <div id="site-header"></div>

  <main>
    <!-- 1. Hero foto dapur gelap -->
    <header class="contact-hero">
      <img class="contact-hero__bg" data-img="kitchen" alt="Dapur Tradisional Nusantara">
      <div class="contact-hero__content">
        <h1 class="display-title" data-i18n="contact.heroTitle"></h1>
        <p data-i18n="contact.heroDesc"></p>
      </div>
    </header>

    <!-- 2. Kartu kontak dua kolom -->
    <section class="contact-card-section" id="kirim-pesan">
      <div class="contact-card">
        <div class="contact-info">
          <div>
            <h2 data-i18n="contact.info.title"></h2>
            <p class="contact-info__desc" data-i18n="contact.info.desc"></p>
            <ul class="contact-info__rows">
              <li class="contact-row">
                <div class="contact-row__icon"><span class="material-symbols-outlined" aria-hidden="true">location_on</span></div>
                <div><div class="contact-row__label" data-i18n="contact.office"></div><div class="contact-row__value" data-i18n="contact.officeValue"></div></div>
              </li>
              <li class="contact-row">
                <div class="contact-row__icon"><span class="material-symbols-outlined" aria-hidden="true">mail</span></div>
                <div><div class="contact-row__label" data-i18n="contact.email"></div><div class="contact-row__value">yawda2940@gmail.com</div></div>
              </li>
              <li class="contact-row">
                <div class="contact-row__icon"><span class="material-symbols-outlined" aria-hidden="true">call</span></div>
                <div><div class="contact-row__label" data-i18n="contact.phone"></div><div class="contact-row__value">087881485375</div></div>
              </li>
            </ul>
          </div>
          <div class="contact-info__social">
            <p data-i18n="contact.follow"></p>
            <a class="instagram-btn" href="https://instagram.com/yawdasaja" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
              <span>@yawdasaja</span>
            </a>
          </div>
        </div>

        <div class="contact-form-col">
          <h2 data-i18n="contact.form.title"></h2>
          <form class="contact-form" id="contact-form">
            <div class="form-group">
              <label class="form-label" for="f-name" data-i18n="contact.form.name"></label>
              <input class="form-input" id="f-name" name="name" type="text" required data-i18n-placeholder="contact.form.namePh">
            </div>
            <div class="form-group">
              <label class="form-label" for="f-company" data-i18n="contact.form.company"></label>
              <input class="form-input" id="f-company" name="company" type="text" data-i18n-placeholder="contact.form.companyPh">
            </div>
            <div class="form-group">
              <label class="form-label" for="f-phone" data-i18n="contact.form.phone"></label>
              <input class="form-input" id="f-phone" name="phone" type="tel" required placeholder="08xxxxxxxxxx">
            </div>
            <div class="form-group">
              <label class="form-label" for="f-email" data-i18n="contact.form.email"></label>
              <input class="form-input" id="f-email" name="email" type="email" required placeholder="nama@email.com">
            </div>
            <div class="form-group form-group--full">
              <label class="form-label" for="f-subject" data-i18n="contact.form.subject"></label>
              <input class="form-input" id="f-subject" name="subject" type="text" required data-i18n-placeholder="contact.form.subjectPh">
            </div>
            <div class="form-group form-group--full">
              <label class="form-label" for="f-message" data-i18n="contact.form.message"></label>
              <textarea class="form-input form-textarea" id="f-message" name="message" required data-i18n-placeholder="contact.form.messagePh"></textarea>
            </div>
            <button class="btn btn--primary form-submit" type="submit">
              <span data-i18n="contact.form.send"></span>
              <span class="material-symbols-outlined icon-sm" aria-hidden="true">send</span>
            </button>
          </form>
        </div>
      </div>
    </section>

    <!-- 3. Lokasi & pusat inovasi -->
    <section class="presence">
      <div class="container">
        <div class="presence__head">
          <div>
            <p class="eyebrow presence__label" data-i18n="contact.presence.label"></p>
            <h2 class="presence__title" data-i18n="contact.presence.title"></h2>
          </div>
          <p class="presence__city font-mono">
            <span class="material-symbols-outlined icon-sm" aria-hidden="true">location_on</span>
            <span data-i18n="contact.presence.city"></span>
          </p>
        </div>
        <div class="presence__grid">
          <div>
            <h3 data-i18n="contact.presence.heading"></h3>
            <p data-i18n="contact.presence.p1"></p>
            <p data-i18n="contact.presence.p2"></p>
            <hr class="presence__rule">
            <div class="quality-badge">
              <div class="quality-badge__icon"><span class="material-symbols-outlined" aria-hidden="true">verified</span></div>
              <div>
                <span class="quality-badge__label font-mono" data-i18n="contact.presence.badgeLabel"></span>
                <div class="quality-badge__title" data-i18n="contact.presence.badgeTitle"></div>
              </div>
            </div>
          </div>
          <div class="frame-triple" data-reveal>
            <div class="frame-triple__inner"><img data-img="building" alt="Gedung Pusat Inovasi Kuliner Nusantara Madiun" loading="lazy"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- 4. Peta Google -->
    <section class="map-section">
      <div class="map-wrap">
        <div class="map-frame">
          <iframe id="map-frame" title="Peta lokasi Nusantara Center di Jalan Pahlawan, Madiun" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
          <div class="map-card">
            <span class="map-card__label font-mono" data-i18n="contact.map.label"></span>
            <p data-i18n="contact.map.text"></p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <div id="site-chatbot"></div>
  <script type="module" src="assets/js/pages/contact.js"></script>
</body>
</html>
