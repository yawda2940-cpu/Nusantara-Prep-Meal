<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nusantara Meal Prep - Beranda</title>
  <meta name="description" content="Layanan meal prep premium masakan Indonesia dengan nutrisi terkontrol dan bahan 100% alami.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=JetBrains+Mono:wght@400..700&family=Plus+Jakarta+Sans:wght@400..700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/pages/home.css">
</head>
<body data-page="home">
  <div id="site-header"></div>

  <main>
    <!-- 1. HERO -->
    <section class="hero">
      <div class="hero__decor" aria-hidden="true">
        <span class="material-symbols-outlined hero__decor-icon hero__decor-icon--1" data-parallax="0.04">eco</span>
        <span class="material-symbols-outlined hero__decor-icon hero__decor-icon--2" data-parallax="0.08">spa</span>
        <span class="material-symbols-outlined hero__decor-icon hero__decor-icon--3" data-parallax="0.05">potted_plant</span>
        <span class="material-symbols-outlined hero__decor-icon hero__decor-icon--4" data-parallax="0.07">filter_vintage</span>
        <span class="material-symbols-outlined hero__decor-icon hero__decor-icon--5" data-parallax="0.03">compost</span>
      </div>
      <div class="container hero__grid">
        <div class="hero__content">
          <h1 class="display-title hero__title" data-i18n-html="home.heroTitle"></h1>
          <p class="hero__desc" data-i18n="home.heroDesc"></p>
          <a class="btn btn--light" href="contact.html#kirim-pesan">
            <span data-i18n="home.heroCta"></span>
            <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span>
          </a>
          <p class="hero__note">
            <span class="material-symbols-outlined fill icon-sm" aria-hidden="true">verified</span>
            <span data-i18n="home.heroNote"></span>
          </p>
          <ul class="hero__pillars">
            <li><span class="material-symbols-outlined" aria-hidden="true">donut_large</span><span data-i18n="home.pillar1"></span></li>
            <li><span class="material-symbols-outlined" aria-hidden="true">recycling</span><span data-i18n="home.pillar2"></span></li>
            <li><span class="material-symbols-outlined" aria-hidden="true">local_shipping</span><span data-i18n="home.pillar3"></span></li>
          </ul>
        </div>
        <div class="hero__visual">
          <img class="hero__img" data-img="nasiKuning" alt="Nutrisi Modern Cita Rasa Nusantara">
          <div class="hero__badge">
            <span class="material-symbols-outlined fill" aria-hidden="true">spa</span>
            <span data-i18n="home.badge"></span>
          </div>
        </div>
      </div>
      <div class="wave wave--flip"></div>
    </section>

    <!-- 2. BAR KEPERCAYAAN (marquee) -->
    <section class="trust">
      <div class="container"><p class="trust__caption" data-i18n="home.trustCaption"></p></div>
      <div class="trust__marquee" aria-hidden="true"><div class="trust-track" id="trust-track"></div></div>
    </section>

    <!-- 3. KENAPA MEMILIH KAMI -->
    <section class="features section">
      <div class="container">
        <div class="section-header" data-reveal>
          <h2 class="headline-title" data-i18n="home.whyTitle"></h2>
          <p data-i18n="home.whySub"></p>
        </div>
        <div class="features__grid">
          <article class="feature-card" data-reveal>
            <div class="feature-card__icon"><span class="material-symbols-outlined" aria-hidden="true">nutrition</span></div>
            <h3 data-i18n="home.f1.title"></h3><p data-i18n="home.f1.desc"></p>
          </article>
          <article class="feature-card" data-reveal>
            <div class="feature-card__icon"><span class="material-symbols-outlined" aria-hidden="true">compost</span></div>
            <h3 data-i18n="home.f2.title"></h3><p data-i18n="home.f2.desc"></p>
          </article>
          <article class="feature-card" data-reveal>
            <div class="feature-card__icon"><span class="material-symbols-outlined" aria-hidden="true">soup_kitchen</span></div>
            <h3 data-i18n="home.f3.title"></h3><p data-i18n="home.f3.desc"></p>
          </article>
        </div>
      </div>
    </section>

    <!-- 4. MENU SIGNATURE -->
    <section class="signature">
      <div class="wave"></div>
      <div class="signature__inner">
        <div class="container">
          <div class="signature__head">
            <div>
              <h2 class="headline-title" data-i18n="home.sigTitle"></h2>
              <p data-i18n="home.sigSub"></p>
            </div>
            <a class="signature__all" href="menu.html">
              <span data-i18n="home.sigAll"></span>
              <span class="material-symbols-outlined icon-sm" aria-hidden="true">arrow_forward</span>
            </a>
          </div>
          <div class="carousel carousel--signature" id="signature-track"></div>
        </div>
      </div>
      <div class="wave wave--flip"></div>
    </section>

    <!-- 5. CORPORATE CATERING (B2B) -->
    <section class="b2b section">
      <div class="container">
        <div class="b2b__card" data-reveal>
          <div class="b2b__content">
            <span class="b2b__badge font-mono" data-i18n="home.b2b.badge"></span>
            <h2 data-i18n="home.b2b.title"></h2>
            <p data-i18n="home.b2b.desc"></p>
            <div>
              <a class="btn btn--bata" href="contact.html#kirim-pesan">
                <span data-i18n="home.b2b.cta"></span>
                <span class="material-symbols-outlined icon-sm" aria-hidden="true">arrow_forward</span>
              </a>
            </div>
          </div>
          <div class="b2b__img"><img data-img="catering" alt="Corporate Catering Nusantara Meal Prep" loading="lazy"></div>
        </div>
      </div>
    </section>

    <!-- 6. TESTIMONI -->
    <section class="testimonials">
      <span class="material-symbols-outlined testimonials__bg-icon" aria-hidden="true">filter_vintage</span>
      <div class="wave"></div>
      <div class="testimonials__inner">
        <div class="container">
          <div class="testimonials__head">
            <h2 data-i18n="home.testiTitle"></h2>
            <p data-i18n="home.testiSub"></p>
          </div>
          <div class="testi-stage"><div class="testi-grid" id="testi-grid"></div></div>
        </div>
      </div>
      <div class="wave wave--flip"></div>
    </section>

    <!-- 7. CTA WHATSAPP -->
    <section class="final-cta">
      <div class="container">
        <div class="final-cta__card" data-reveal>
          <h2 class="display-title" data-i18n="home.ctaTitle"></h2>
          <p data-i18n="home.ctaDesc"></p>
          <a class="btn btn--whatsapp" id="cta-whatsapp" href="https://wa.me/6287881485375" target="_blank" rel="noopener noreferrer">
            <span class="material-symbols-outlined" aria-hidden="true">chat</span>
            <span data-i18n="home.ctaBtn"></span>
          </a>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <div id="site-chatbot"></div>
  <script type="module" src="assets/js/pages/home.js"></script>
</body>
</html>
